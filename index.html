
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    viewport-fit=cover, user-scalable=no"
  >

  <meta name="theme-color" content="#173d35">

  <title>Mystery Island: The Lost Keys</title>

  <link rel="stylesheet" href="./style.css?v=20261010-dialog">
</head>

<body>

  <div id="game-app">

    <!-- MAIN GAME SCREEN -->
    <main id="game-screen">

      <canvas
        id="game-canvas"
        aria-label="Mystery Island game world"
      ></canvas>

      <!-- TOP INTERFACE -->
      <header id="game-header">

        <div class="game-title">
          Mystery Island
        </div>

        <div id="location-name">
          Родной город
        </div>

      </header>

      <!-- GAME CONTROLS -->
      <nav id="game-controls">

        <button
          id="btn-backpack"
          class="game-button"
          type="button"
        >
          🎒 Рюкзак
        </button>

        <button
          id="btn-map"
          class="game-button"
          type="button"
        >
          🗺️ Карта
        </button>

        <button
          id="btn-menu"
          class="game-button"
          type="button"
        >
          ☰ Меню
        </button>

      </nav>

      <!-- MESSAGES -->
      <div
        id="game-message"
        role="status"
        aria-live="polite"
      ></div>

    </main>

    <!-- BACKPACK WINDOW -->
    <section
      id="backpack-panel"
      class="game-panel hidden"
      aria-label="Рюкзак"
    >

      <div class="panel-header">

        <h2>🎒 Рюкзак</h2>

        <button
          id="close-backpack"
          class="game-button"
          type="button"
        >
          ✕
        </button>

      </div>

      <div id="inventory-container"></div>

    </section>

    <!-- MAP WINDOW -->
    <section
      id="map-panel"
      class="game-panel hidden"
      aria-label="Карта"
    >

      <div class="panel-header">

        <h2>🗺️ Карта мира</h2>

        <button
          id="close-map"
          class="game-button"
          type="button"
        >
          ✕
        </button>

      </div>

      <div id="world-map-container"></div>

    </section>

    <!-- GAME MENU -->
    <section
      id="menu-panel"
      class="game-panel hidden"
      aria-label="Меню"
    >

      <div class="panel-header">

        <h2>Меню игры</h2>

        <button
          id="close-menu"
          class="game-button"
          type="button"
        >
          ✕
        </button>

      </div>

      <button
        id="btn-save"
        class="game-button"
        type="button"
      >
        💾 Сохранить игру
      </button>

      <button
        id="btn-save-exit"
        class="game-button"
        type="button"
      >
        🚪 Сохранить и выйти
      </button>

    </section>

  </div>

  <!-- GAME MODULES -->
  <script type="module" src="./js/main.js?v=20261010-dialog"></script>

</body>
</html>
