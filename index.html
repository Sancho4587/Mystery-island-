
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    viewport-fit=cover, user-scalable=no"
  >

  <meta name="theme-color" content="#173d35">

  <title>Mystery Island: The Lost Keys</title>

  <link rel="stylesheet" href="./style.css?v=20261011-time">
</head>

<body>

  <div id="game-app">

    <!-- MAIN GAME SCREEN -->
    <main id="game-screen">

      <canvas
        id="game-canvas"
        aria-label="Mystery Island game world"
      ></canvas>

      <!-- TOP INTERFACE -->
      <header id="game-header">

        <div class="game-title">
          Mystery Island
        </div>

        <div id="location-name">
          Родной город
        </div>

        <div class="player-condition">
          <span id="stamina-label">Выносливость: 100%</span>
          <progress id="stamina-meter" value="100" max="100" aria-label="Выносливость"></progress>
          <span id="load-warning"></span>
        </div>
      </header>

      <!-- GAME CONTROLS -->
      <nav id="game-controls">

        <button
          id="btn-backpack"
          class="game-button"
          type="button"
        >
          🎒 Рюкзак
        </button>

        <button
          id="btn-map"
          class="game-button"
          type="button"
        >
          🗺️ Карта
        </button>

        <button
          id="btn-menu"
          class="game-button"
          type="button"
        >
          ☰ Меню
        </button>

      </nav>

      <!-- MESSAGES -->
      <div
        id="game-message"
        role="status"
        aria-live="polite"
      ></div>

    </main>

    <!-- BACKPACK WINDOW -->
    <section
      id="backpack-panel"
      class="game-panel hidden"
      aria-label="Рюкзак"
    >

      <div class="panel-header">

        <h2>🎒 Рюкзак</h2>

        <button
          id="close-backpack"
          class="game-button"
          type="button"
        >
          ✕
        </button>

      </div>

      <div class="backpack-layout">
        <section class="backpack-items" aria-labelledby="bag-items-title">
          <h3 id="bag-items-title">Предметы</h3>
          <div id="carried-weight" data-state="available" role="status">
            <strong id="weight-total"></strong>
            <progress id="weight-meter" max="15" value="0" aria-label="Переносимый вес"></progress>
            <p id="weight-breakdown"></p>
            <p id="weight-status"></p>
          </div>
          <div id="backpack-capacity" data-state="available" role="status">
            <div class="capacity-line"><strong id="capacity-count"></strong><span id="capacity-status"></span></div>
            <progress id="capacity-meter" max="12" value="0" aria-label="Заполненность рюкзака"></progress>
          </div>
          <p class="bag-stack-hint">Одинаковые предметы — одна ячейка</p>
          <div id="inventory-container"></div>
        </section>
        <section class="character-equipment" aria-labelledby="equipment-title">
          <h3 id="equipment-title">Экипировка</h3>
          <div class="equipment-stage">
            <svg class="equipment-avatar" viewBox="0 0 180 300" role="img" aria-label="Силуэт персонажа в текущей экипировке">
              <ellipse cx="90" cy="284" rx="46" ry="9" fill="#193b32" opacity=".15"/>
              <g fill="#b5bda9" stroke="#788775" stroke-width="2">
                <circle cx="90" cy="42" r="23"/>
                <path d="M78 64h24l6 13 20 9 24 78-15 6-24-57-3 68 9 87h-22l-7-71-7 71H61l9-87-3-68-24 57-15-6 24-78 20-9Z"/>
              </g>
              <g id="avatar-body" fill="#4d8770" stroke="#285440" stroke-width="2">
                <path d="m73 74 17 9 17-9 21 12 12 39-18 7-10-23-2 71H70l-2-71-10 23-18-7 12-39Z"/>
                <path d="M90 86v89" fill="none" stroke="#a9c99e"/>
                <path d="m76 76 14 10 14-10" fill="none" stroke="#d7dfb4" stroke-width="3"/>
              </g>
              <path id="avatar-legs" d="M70 176h40l9 86H98l-8-64-8 64H61Z" fill="#677b86" stroke="#3c525d" stroke-width="2"/>
              <g id="avatar-feet" fill="#765039" stroke="#4d3327" stroke-width="2">
                <path d="M62 251h20l-2 28H51v-10l10-6Z"/><path d="M98 251h20l1 12 10 6v10h-29Z"/>
              </g>
            </svg>
            <div id="equipment-slots"></div>
          </div>
          <p id="equipment-summary"></p>
        </section>
      </div>
      <section id="inventory-details" aria-label="Описание предмета" aria-live="polite"></section>

    </section>

    <!-- MAP WINDOW -->
    <section
      id="map-panel"
      class="game-panel hidden"
      aria-label="Карта"
    >

      <div class="panel-header">

        <h2>🗺️ Карта и журнал</h2>

        <button
          id="close-map"
          class="game-button"
          type="button"
        >
          ✕
        </button>

      </div>

      <div id="world-map-container"></div>

    </section>

    <!-- GAME MENU -->
    <section
      id="menu-panel"
      class="game-panel hidden"
      aria-label="Меню"
    >

      <div class="panel-header">

        <h2>Меню игры</h2>

        <button
          id="close-menu"
          class="game-button"
          type="button"
        >
          ✕
        </button>

      </div>

      <p id="playtime-status" role="status"></p>
      <button id="btn-return-home" class="game-button" type="button">🏠 Вернуться домой</button>
      <button id="btn-rest" class="game-button" type="button">🌙 Отдохнуть до завтра</button>
      <button id="btn-parents" class="game-button" type="button">🔒 Родительские настройки</button>
      <button
        id="btn-save"
        class="game-button"
        type="button"
      >
        💾 Сохранить игру
      </button>

      <button
        id="btn-save-exit"
        class="game-button"
        type="button"
      >
        🚪 Сохранить и выйти
      </button>

    </section>

  </div>

  <!-- GAME MODULES -->
  <script type="module" src="./js/main.js?v=20261011-time"></script>

</body>
</html>
